spring:
  application:
    name: market-risk-processing
  main:
    # Spark manages its own web UI; disable Spring's embedded server unless needed
    web-application-type: none
  # DataSource auto-configuration is disabled globally; QuestDB is optional.
  # Activated only under the "questdb" profile via DataSourceConfig bean.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration

spark:
  app-name: market-risk-processing
  # Override to yarn or spark://<host>:7077 in production
  master: local[*]

logging:
  level:
    root: INFO
    com.kacemrisk.market.infrastructure: DEBUG
    com.kacemrisk.market.domain: DEBUG

# Scheduler — disabled by default; enable per environment
scenario:
  schedule:
    enabled: false
    cron: "0 0 18 * * MON-FRI"
    default-portfolio-path: data/portfolio.csv
    default-prices-path: data/prices
    default-confidence-level: 0.99
    default-num-paths: 10000
  kafka:
    topic: scenario-notifications

# Alpha Vantage historical price provider
# Override alphavantage.api-key via the ALPHA_VANTAGE_API_KEY environment variable.
# Free tier: 25 req/day → keep fetch-concurrency low (default 5).
alphavantage:
  api-key: ${ALPHA_VANTAGE_API_KEY:demo}
  base-url: https://www.alphavantage.co/query
  # compact = last 100 trading days | full = up to 20 years
  output-size: compact
  fetch-concurrency: 5

# OpenAPI / Swagger UI — disabled by default (no servlet container in default profile)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
# Local developer profile — activate with -Plocal (Maven) or --spring.profiles.active=local
# Spark runs in-process (local[*]); no cluster, no Kafka required.
spring:
  config:
    activate:
      on-profile: local
  main:
    web-application-type: servlet   # expose REST endpoint for manual testing

server:
  port: 8080

spark:
  master: local[*]

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.kacemrisk.market: DEBUG     # verbose domain + infrastructure output


---
# Kafka profile — activate with --spring.profiles.active=kafka
spring:
  config:
    activate:
      on-profile: kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: market-risk-processing
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

var:
  results:
    kafka:
      topic: ${VAR_RESULTS_TOPIC:var-results}

---
# QuestDB profile — activate with --spring.profiles.active=local,questdb
# Connects via the PostgreSQL wire protocol (port 8812).
# Run QuestDB: docker compose up questdb
spring:
  config:
    activate:
      on-profile: questdb
  datasource:
    url: ${QUESTDB_URL:jdbc:postgresql://localhost:8812/questdb}
    username: ${QUESTDB_USER:admin}
    password: ${QUESTDB_PASSWORD:quest}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000

