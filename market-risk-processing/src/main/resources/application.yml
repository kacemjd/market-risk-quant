spring:
  application:
    name: market-risk-processing
  main:
    # Spark manages its own web UI; disable Spring's embedded server unless needed
    web-application-type: none
  # DataSource auto-configuration is disabled globally; QuestDB is optional.
  # Activated only under the "questdb" profile via DataSourceConfig bean.
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceInitializationAutoConfiguration

spark:
  app-name: market-risk-processing
  # Override to yarn or spark://<host>:7077 in production
  master: local[*]

logging:
  level:
    root: INFO
    com.kacemrisk.market.infrastructure: DEBUG
    com.kacemrisk.market.domain: DEBUG

# ── Scheduler ────────────────────────────────────────────────────────────────
# Disabled by default; flip scenario.schedule.enabled=true per environment.
# All fields mirror ScenarioRequest — the scheduler builds a full notification from these.
scenario:
  schedule:
    enabled: false
    cron: "0 0 18 * * MON-FRI"
    portfolio-path:     data/portfolio.csv
    var-method:         HISTORICAL
    confidence-level:   0.99
    historical-window:  99          # ≤ 100 → stays within Alpha Vantage compact output
    num-paths:          10000       # used only by MONTE_CARLO
    time-grid:          GRID_53
  kafka:
    topic: scenario-notifications

# ── Alpha Vantage ─────────────────────────────────────────────────────────────
# Override alphavantage.api-key via the ALPHA_VANTAGE_API_KEY environment variable.
# Free tier: 25 req/day → keep fetch-concurrency low (default 5).
alphavantage:
  api-key: ${ALPHA_VANTAGE_API_KEY:demo}
  base-url: https://www.alphavantage.co/query
  # compact = last 100 trading days | full = up to 20 years
  output-size: compact
  fetch-concurrency: 5
  # Max wall-clock seconds to wait for all tickers to complete (free tier is slow)
  fetch-timeout-seconds: 120

# OpenAPI / Swagger UI — disabled by default (no servlet container in default profile)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ── Data-source strategy ──────────────────────────────────────────────────
# input.source           : rest (Alpha Vantage API, default) | csv (local files)
# input.csv.prices-path  : classpath root-relative folder containing <TICKER>.csv files
# input.portfolio.path   : portfolio CSV — classpath-relative, absolute, s3://, or hdfs://
# output.sink            : log (stdout, default) | questdb | kafka
input:
  source: rest
  portfolio:
    path: data/portfolio.csv
  csv:
    prices-path: data/prices

output:
  sink: log

---
# ── Local developer profile ───────────────────────────────────────────────────
# Activate with --spring.profiles.active=local
# Spark runs in-process (local[*]); no cluster, no Kafka required.
# Trigger via: POST http://localhost:8080/scenarios/run  (body: {} or full ScenarioRequest)
spring:
  config:
    activate:
      on-profile: local
  main:
    web-application-type: servlet   # expose REST + Swagger UI

server:
  port: 8080

spark:
  master: local[*]

# CSV price loader — no API key needed for local development
input:
  source: csv
  portfolio:
    path: data/portfolio.csv
  csv:
    prices-path: data/prices

output:
  sink: log

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    com.kacemrisk.market: DEBUG

---
# ── Kafka profile ─────────────────────────────────────────────────────────────
# Activate with --spring.profiles.active=kafka
spring:
  config:
    activate:
      on-profile: kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: market-risk-processing
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

output:
  sink: kafka

var:
  results:
    kafka:
      topic: ${VAR_RESULTS_TOPIC:var-results}

---
# ── Docker profile ────────────────────────────────────────────────────────────
# Activate with SPRING_PROFILES_ACTIVE=docker
# Starts with REST + Swagger UI exposed on :8080.
# Trigger the pipeline via: POST http://localhost:8080/scenarios/run
# Minimal body example (all defaults):  {}
# Full body example:
#   { "varMethod": "HISTORICAL", "historicalWindow": 99, "confidenceLevel": 0.99 }
spring:
  config:
    activate:
      on-profile: docker
  main:
    web-application-type: servlet

server:
  port: 8080

spark:
  master: local[1]          # single thread — conserves Docker container memory

# Alpha Vantage REST loader (set ALPHA_VANTAGE_API_KEY env var)
input:
  source: rest
  portfolio:
    path: data/portfolio.csv

output:
  sink: log                 # override to questdb by adding the questdb profile

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.kacemrisk.market: DEBUG

---
# ── QuestDB profile ───────────────────────────────────────────────────────────
# Activate with --spring.profiles.active=local,questdb (or docker,questdb)
# Connects via the PostgreSQL wire protocol (port 8812).
# Run QuestDB: docker compose up questdb
spring:
  config:
    activate:
      on-profile: questdb
  datasource:
    url: ${QUESTDB_URL:jdbc:postgresql://localhost:8812/questdb}
    username: ${QUESTDB_USER:admin}
    password: ${QUESTDB_PASSWORD:quest}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 60000   # 60 s — gives QuestDB time to accept connections on restart
      initialization-fail-timeout: -1  # -1 = keep retrying pool init indefinitely

output:
  sink: questdb             # activates QuestDbVaRResultPublisher, DataSourceConfig, etc.
