# ── Integration test profile ──────────────────────────────────────────────
# Activated by @ActiveProfiles("int") in integration tests.
# Uses local CSV price files so no API key is needed.
input:
  source: csv
  portfolio:
    path: market-data/portfolio.csv   # resolves to src/test/resources/market-data/portfolio.csv
  csv:
    prices-path: market-data/prices   # resolves to src/test/resources/market-data/prices/
