services:

  questdb:
    image: questdb/questdb:8.2.1
    container_name: market-risk-questdb
    ports:
      - "9000:9000"   # REST API + web console  →  http://localhost:9000
      - "9009:9009"   # InfluxDB line protocol
      - "8812:8812"   # PostgreSQL wire protocol  →  jdbc:postgresql://localhost:8812/questdb
    environment:
      QDB_CAIRO_COMMIT_LAG: 1000
      QDB_LINE_TCP_MAINTENANCE_JOB_INTERVAL: 100
    volumes:
      - questdb-data:/root/.questdb
    # QuestDB flushes its WAL on SIGTERM — give it time before Docker sends SIGKILL.
    stop_grace_period: 30s
    # Use the /exec SQL endpoint — more reliable than /health and confirms the engine
    # is truly ready (not just the HTTP listener).  Falls back to wget if curl is absent.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9000/exec?query=select%201' >/dev/null 2>&1 || wget -qO- 'http://localhost:9000/exec?query=select%201' >/dev/null 2>&1"]
      start_period: 60s   # Windows/Docker-Desktop WSL2 is slower — give extra grace
      interval: 10s
      timeout: 10s
      retries: 15

  redpanda:
    image: redpandadata/redpanda:v24.2.18
    container_name: market-risk-redpanda
    ports:
      - "9092:9092"   # Kafka wire protocol
      - "9644:9644"   # Admin API
      - "8081:8081"   # Schema Registry
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
      - --set redpanda.enable_transactions=true
      - --set redpanda.enable_idempotence=true
      - --set redpanda.auto_create_topics_enabled=true
    healthcheck:
      test: [ "CMD", "rpk", "cluster", "info" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Historical VaR processing service ─────────────────────────────────────
  # Starts after QuestDB is healthy, then:
  #   1. Fetches historical prices from Alpha Vantage (set ALPHA_VANTAGE_API_KEY)
  #   2. Runs Historical Simulation VaR for each portfolio in data/portfolio.csv
  #   3. Persists market calibration + VaR results to QuestDB
  #   4. Exposes REST API on port 8080 (Swagger UI: http://localhost:8080/swagger-ui.html)
  #
  # Usage:
  #   ALPHA_VANTAGE_API_KEY=<your-key> docker compose up --build
  market-risk-processing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-risk-processing
    depends_on:
      questdb:
        condition: service_started   # don't gate on healthcheck — app retries via HikariCP
    restart: on-failure              # if QuestDB isn't ready yet, Docker restarts the app
    ports:
      - "8080:8080"
    environment:
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-demo}
      QUESTDB_URL: jdbc:postgresql://questdb:8812/questdb
      QUESTDB_USER: admin
      QUESTDB_PASSWORD: quest
    mem_limit: 3g
    # Must be > spring.lifecycle.timeout-per-shutdown-phase (30 s).
    # Docker sends SIGTERM → Spring drains in-flight requests/Spark jobs (≤30 s) → exits cleanly.
    # Docker only sends SIGKILL if the JVM hasn't exited within this window.
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1 || wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1"]
      start_period: 120s
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  questdb-data:

