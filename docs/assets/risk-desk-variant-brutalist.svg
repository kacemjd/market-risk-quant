<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1260" viewBox="0 0 1280 1260" role="img" aria-labelledby="brutalist-title brutalist-desc">
  <!--
  THESIS: Risk evidence is printed like an operational broadsheet, refusing the soft-card dashboard while keeping every number auditable.
  OWN-WORLD: Bone paper, structural black, signal yellow, risk purple, breach red, square corners, heavy rules, and offset print shadows.
  STORY: Read the verdict, verify the governing method and limit, inspect the tail, reconcile attribution, then confirm backtest behaviour.
  FIRST VIEWPORT: A black masthead, oversized verdict, exposed method control, and one continuous metric ledger lead immediately into the evidence grid.
  FORM: Neo-brutalist operations broadsheet; the brief explicitly pins the visual world, so no concept seed is used.
  -->
  <title id="brutalist-title">Brutalist alternative for the market risk desk</title>
  <desc id="brutalist-desc">A 1280 by 1260 desktop static mockup using heavy black rules, square blocks, offset shadows, oversized typography, and signal colour. It shows illustrative synthetic VaR, expected shortfall, approximate ten-day VaR, limit usage, additive component VaR, separate diversification, a P and L distribution, and a sixty-day backtest.</desc>

