<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="control-room-title control-room-desc">
  <!--
  THESIS: A risk control board where every headline number remains visually tethered to evidence; it refuses the generic equal-card dashboard.
  OWN-WORLD: Cool off-white field, graphite rails, tabular figures, hairline rules, and restrained purple/red/amber/green status coding.
  STORY: The manager confirms method and freshness, scans four measures, then verifies distribution, additive allocation, diversification, and backtest evidence.
  FIRST VIEWPORT: A narrow command header and full-width method rail lead into a metric ledger, with a wide distribution plot beside a reconciliation column and a 60-day evidence strip below.
  FORM: Operations ledger, ranked first; staged as a page-wide control rail above linked evidence zones; no concept seed because the brief explicitly pins CONTROL ROOM.
  -->
  <title id="control-room-title">Control Room alternative for a Java market-risk dashboard</title>
  <desc id="control-room-desc">A 1280 pixel desktop static mockup using a calm, dense operations layout. It shows illustrative synthetic values for VaR, expected shortfall, approximate ten-day VaR, exceptions, a P and L distribution, additive component VaR, diversification, and a sixty-day backtest.</desc>

  <rect width="1280" height="960" fill="#F4F4F1"/>

