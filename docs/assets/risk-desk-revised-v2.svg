<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="risk-v2-title risk-v2-desc">
  <!--
  THESIS: A risk reviewer should move from verdict to evidence in one uninterrupted reading path; the generic row of equal metric cards is refused.
  OWN-WORLD: Cool porcelain, an obsidian navigation rail, precise hairlines, one measured violet, and narrow semantic red, amber, and green signals.
  STORY: Establish run provenance, read the dominant one-day VaR, compare supporting measures, inspect the tail and attribution, then verify backtest behaviour.
  FIRST VIEWPORT: A compact dark rail and quiet header frame an asymmetric risk ledger where VaR owns the left field and supporting measures share one continuous right ledger.
  FORM: Precision instrument panel, preserving the first design's analytical structure while replacing its template-card composition.
  -->
  <title id="risk-v2-title">Market risk desk refined v2 static design</title>
